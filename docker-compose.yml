# Local Postgres for development and tests.
# Host port defaults to 5434 so it does not clash with other local Postgres instances.
services:
  db:
    image: postgres:16-alpine
    container_name: swarm-db
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    ports:
      - "${SWARM_DB_PORT:-5434}:5432"
    volumes:
      - swarm-db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  swarm-db-data:
